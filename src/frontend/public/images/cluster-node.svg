<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon -->
  <polygon points="50,5 93,27.5 93,72.5 50,95 7,72.5 7,27.5" stroke="#00ff41" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Inner hexagon -->
  <polygon points="50,20 78,35 78,65 50,80 22,65 22,35" stroke="#00ff41" stroke-width="1.5" fill="#00ff41" fill-opacity="0.1"/>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="15" stroke="#00d4ff" stroke-width="2" fill="#00d4ff" fill-opacity="0.2"/>
  <!-- Inner dot -->
  <circle cx="50" cy="50" r="6" fill="#00ff41"/>
  <!-- Connection points -->
  <circle cx="50" cy="20" r="3" fill="#00d4ff"/>
  <circle cx="78" cy="35" r="3" fill="#00d4ff"/>
  <circle cx="78" cy="65" r="3" fill="#00d4ff"/>
  <circle cx="50" cy="80" r="3" fill="#00d4ff"/>
  <circle cx="22" cy="65" r="3" fill="#00d4ff"/>
  <circle cx="22" cy="35" r="3" fill="#00d4ff"/>
</svg>
